# Builds the release image and pushes it to GitHub Container Registry.
#
# A merged PR into main, or a manual run, builds an image tagged `latest`,
# the run number and the commit SHA. The digest is written to the run's
# summary: deploy by digest (see charts/cluebert/README.md).
#
# Runtime secrets (SECRET_KEY_BASE, database credentials) are never passed
# to the build. They belong to the Helm release, not the image.

name: Build image

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_image:
    name: Build and push image
    runs-on: ubuntu-latest
    # Merged PRs and manual runs; not PRs closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.run_number }}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Deploy with \`--set image.digest=${DIGEST}\` (see charts/cluebert/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
