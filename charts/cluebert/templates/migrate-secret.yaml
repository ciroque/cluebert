{{- if .Values.migrate.enabled }}
# The migrate Job's copy of the Secret. On pre-upgrade the release Secret
# still holds the previous values, so the hook renders its own.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluebert.migrateSecretName" . }}
  labels:
    {{- include "cluebert.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade,post-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- include "cluebert.secretData" . | nindent 2 }}
{{- end }}
